server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: question-service
              uri: http://localhost:9091
              predicates:
                - Path=/questions/**

            - id: evaluation-service
              uri: http://localhost:9092
              predicates:
                - Path=/evaluation/**